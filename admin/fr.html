<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Posfin France · lien Vanessa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--paper:#FBF7EE;--line:#E3DCCB;--err:#B42318;--ok:#1F7A4D;--sans:"DM Sans",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:16px/1.5 var(--sans)}
header{background:var(--navy);color:#fff;padding:14px 16px;font-weight:700;letter-spacing:.12em}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:560 30px/1.2 var(--serif);margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
label{display:block;font:700 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
input,textarea{width:100%;border:1.5px solid #C9D3DF;border-radius:12px;padding:12px;font:16px var(--sans);min-height:48px}
textarea{min-height:140px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 14px;border-radius:999px;border:0;background:var(--navy);color:#fff;font:700 15px var(--sans);text-decoration:none;cursor:pointer}
.ghost{background:#fff;color:var(--navy);border:1.5px solid rgba(11,31,58,.25)}
.test{background:#8A1C1C;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700}
.warn{background:#FFF6E8;border:1px solid #E6C48A;border-radius:12px;padding:10px 12px}
.bad{color:var(--err)}.ok{color:var(--ok)}
.meta{color:#4F5F78;font-size:14px}
</style>
</head>
<body>
<header>POSFIN FRANCE</header>
<main>
  <h1>Lien pour Vanessa</h1>
  <p class="meta">Le bouton ouvre WhatsApp sur le téléphone de Vanessa. Aucun message n'est envoyé tant qu'elle n'appuie pas sur envoyer.</p>
  <form class="card" id="find">
    <label for="lead">Identifiant du dossier</label>
    <input id="lead" name="lead" autocomplete="off" required>
    <label for="admin" style="margin-top:12px">Jeton admin (pour créer un lien sur un vrai dossier)</label>
    <input id="admin" name="admin" type="password" autocomplete="off">
    <div class="row">
      <button type="submit" id="show">Afficher le lien</button>
      <button type="button" class="ghost" id="mint">Créer un nouveau lien</button>
    </div>
    <p id="msg" class="meta" role="status"></p>
  </form>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params = new URLSearchParams(location.search);
if (params.get("lead")) $("lead").value = params.get("lead");
const saved = sessionStorage.getItem("posfin_fr_admin") || "";
if (saved) $("admin").value = saved;

function headers() {
  const token = $("admin").value.trim();
  sessionStorage.setItem("posfin_fr_admin", token);
  return token ? { "Content-Type": "application/json", "X-Fr-Admin-Token": token } : { "Content-Type": "application/json" };
}
function render(data) {
  const test = data.is_test ? `<p class="test">TEST — ${esc(data.full_name)}. Ne pas contacter. Ne rien envoyer à un prêteur.</p>` : "";
  $("out").innerHTML = `${test}<section class="card"><p class="warn">Rien n'est envoyé automatiquement. Vanessa ouvre ce lien sur son téléphone, puis décide d'envoyer.</p><p><strong>${esc(data.full_name || "")}</strong><br>${esc(data.company_name || "")}<br>${esc(data.phone || "")}</p><label for="smart">Lien sécurisé du client</label><input id="smart" readonly value="${esc(data.smart_url)}"><label for="text" style="margin-top:12px">Message</label><textarea id="text" readonly>${esc(data.whatsapp_text)}</textarea><div class="row"><a class="btn" id="wa" href="${esc(data.whatsapp_url)}" target="_blank" rel="noopener noreferrer">Ouvrir WhatsApp</a><button type="button" class="ghost" id="copy">Copier le message</button></div><p class="meta">sends_message: false</p></section>`;
  $("copy").onclick = async () => { await navigator.clipboard.writeText(data.whatsapp_text); $("msg").textContent = "Message copié."; };
}
async function call(action) {
  $("msg").textContent = "Chargement…";
  $("msg").className = "meta";
  const response = await fetch("/api/fr-factfind", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({ action, lead_id: $("lead").value.trim() }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.ok) {
    $("out").innerHTML = "";
    $("msg").textContent = data.error === "no_link" ? "Pas encore de lien. Créez-en un avec le jeton admin." : (data.error || "Introuvable");
    $("msg").className = "bad";
    return;
  }
  $("msg").textContent = action === "mint" ? "Nouveau lien créé. Aucun message envoyé." : "Lien prêt. Aucun message envoyé.";
  $("msg").className = "ok";
  render(data);
}
$("find").addEventListener("submit", (event) => { event.preventDefault(); call("staff"); });
$("mint").addEventListener("click", () => call("mint"));
if ($("lead").value) call("staff");
</script>
</body>
</html>
