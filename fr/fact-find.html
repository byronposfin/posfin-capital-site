<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demande de financement · Posfin France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,560;9..144,640&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--teal:#0F8F9A;--ink:#0B1F3A;--muted:#4F5F78;--paper:#FBF7EE;--line:#E3DCCB;--err:#B42318;--ok:#1F7A4D;--serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper)}
header{background:var(--navy);color:#fff}header .in{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 14px/1.1 var(--sans);letter-spacing:.14em}
.brand img{width:32px;height:32px;filter:brightness(1.7)}
.brand small{display:block;letter-spacing:.18em;font-weight:500;color:#8FDBE4;font-size:10px}
.lang{display:inline-flex;align-items:center;gap:0;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;min-height:40px;padding:3px;font:700 13px/1 var(--sans);letter-spacing:.04em;cursor:pointer}
.lang:focus-visible{outline:3px solid #8FDBE4;outline-offset:2px}
.lang-opt{min-width:36px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:0 8px;color:rgba(255,255,255,.7)}
.lang-opt.on{background:#fff;color:var(--navy)}
.lang-sep{padding:0 1px;color:rgba(255,255,255,.55);font-weight:500}
main{max-width:720px;margin:0 auto;padding:22px 16px 48px}
h1{font:560 32px/1.15 var(--serif);margin:0 0 8px} .intro{color:var(--muted);margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}.lead strong{color:var(--ink);font-weight:600}
.testbar{background:#8A1C1C;color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 24px 50px -32px rgba(11,31,58,.45)}
.rail{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.rail div{font:700 12px/1.3 var(--sans);color:#8B98AB;padding-top:8px;border-top:4px solid #E6EDF3}
.rail div.on{color:var(--navy);border-top-color:#0FB8C9}.rail div.done{color:var(--teal);border-top-color:var(--teal)}
h2{font:560 26px/1.2 var(--serif);margin:0 0 6px}.sub{color:var(--muted);margin:0 0 16px}
.known{background:#F2FBFC;border:1px solid #C5E7EA;border-radius:14px;padding:12px 14px;margin:0 0 16px}
.known b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.known p{margin:4px 0 0}
label.l{display:block;font:700 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#4A5B75;margin:0 0 6px}
.field{margin:0 0 14px}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid #C9D3DF;padding:12px 14px;font:16px var(--sans);color:var(--ink);background:#fff}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0FB8C9;box-shadow:0 0 0 4px rgba(15,184,201,.18)}
.err{color:var(--err);font-size:13px;min-height:0;margin-top:4px}.bad{border-color:var(--err)!important}
.drop{border:1.5px dashed var(--teal);border-radius:16px;padding:16px;background:#F7FCFC}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:999px;font:700 15px/1 var(--sans);border:0;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid rgba(11,31,58,.25)}
.btn[disabled]{opacity:.55}
.files{list-style:none;padding:0;margin:12px 0 0}.files li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start}.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--navy)}
.status{font-size:14px;color:var(--muted);min-height:1.2em}.status.ok{color:var(--ok)}.status.bad{color:var(--err)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.note{font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media(max-width:640px){h1{font-size:28px}.card{padding:16px}}
</style>
<script src="/meta-pixel.js" defer></script></head>
<body>
<header><div class="in"><a class="brand" href="/"><img src="/assets/logo-mark.png" alt=""><span>POSFIN<small id="brandSub">FRANCE</small></span></a><button class="lang" type="button" id="lang" role="switch" aria-checked="false"><span class="lang-opt on" data-side="fr">FR</span><span class="lang-sep" aria-hidden="true">/</span><span class="lang-opt" data-side="en">EN</span></button></div></header>
<main>
  <h1 id="title">Demande de financement</h1>
  <p class="intro" id="intro"></p>
  <p class="lead" id="lead"><span id="leadLabel">Votre interlocutrice Posfin France :</span> <strong>Vanessa Hardy</strong></p>
  <div id="app"></div>
</main>
<script type="module" src="/fr/fact-find.js?v=20261127-fr4"></script>
</body>
</html>
